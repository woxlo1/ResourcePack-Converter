name: Bug report
description: Report a conversion, UI or packaging problem.
title: 'bug: '
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include personal data.
        For security issues, use the private advisory link instead of this form.

  - type: dropdown
    id: app
    attributes:
      label: Application
      options:
        - Web app
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Conversion engine / tests only
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Version
      description: App version or commit, source pack format/version, and target version.
      placeholder: '0.1.0, source format 15 (1.20.1) → 1.21.4 (46)'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence. Mention the ZIP/folder structure if relevant.
      placeholder: |
        1. Import pack.zip
        2. Select target 1.21.4
        3. Start conversion
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and the report status for affected files.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Report or logs
      description: Paste the report excerpt or console output. Attach a minimal ZIP if you can share it.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest `main` or release.
          required: true
        - label: This is not a security issue.
          required: true
